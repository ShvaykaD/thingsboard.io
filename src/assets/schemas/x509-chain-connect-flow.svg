<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" font-family="Roboto, Helvetica, Arial, sans-serif">
  <title>What happens when a device connects with a certificate chain</title>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#c1c3c8" fill-opacity="0.5"></circle>
    </pattern>
  </defs>
  <rect width="720" height="600" fill="#ffffff"></rect>
  <rect width="720" height="600" fill="url(#dots)"></rect>

  <rect x="210.5" y="20.5" width="300" height="40" rx="9.5" fill="#cfd4fc" stroke="#3d50f5"></rect>
  <text x="360" y="45" text-anchor="middle" font-size="14" font-weight="600" fill="#17181c">Device connects with a certificate chain</text>
  <line x1="360" y1="61" x2="360" y2="82" stroke="#555962" stroke-width="1.2"></line>
  <polygon points="355,82 360,90 365,82" fill="#555962"></polygon>

  <rect x="210.5" y="90.5" width="300" height="50" rx="9.5" fill="#edeef3" stroke="#555962"></rect>
  <text x="360" y="111" text-anchor="middle" font-size="13" fill="#17181c">Is the device certificate already</text>
  <text x="360" y="129" text-anchor="middle" font-size="13" fill="#17181c">bound to a device?</text>
  <line x1="511" y1="115" x2="552" y2="115" stroke="#555962" stroke-width="1.2"></line>
  <polygon points="552,110 560,115 552,120" fill="#555962"></polygon>
  <text x="531" y="108" text-anchor="middle" font-size="12" fill="#555962">yes</text>
  <rect x="560.5" y="95.5" width="140" height="40" rx="9.5" fill="#defbd0" stroke="#4fdf0c"></rect>
  <text x="630" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#17181c">Connected</text>
  <line x1="360" y1="141" x2="360" y2="172" stroke="#555962" stroke-width="1.2"></line>
  <polygon points="355,172 360,180 365,172" fill="#555962"></polygon>
  <text x="368" y="160" font-size="12" fill="#555962">no</text>

  <rect x="210.5" y="180.5" width="300" height="50" rx="9.5" fill="#edeef3" stroke="#555962"></rect>
  <text x="360" y="201" text-anchor="middle" font-size="13" fill="#17181c">Does the chain contain a CA</text>
  <text x="360" y="219" text-anchor="middle" font-size="13" fill="#17181c">registered on a device profile?</text>
  <line x1="511" y1="205" x2="552" y2="205" stroke="#555962" stroke-width="1.2"></line>
  <polygon points="552,200 560,205 552,210" fill="#555962"></polygon>
  <text x="531" y="198" text-anchor="middle" font-size="12" fill="#555962">no</text>
  <rect x="560.5" y="185.5" width="140" height="40" rx="9.5" fill="#f9c3d6" stroke="#f53d7d"></rect>
  <text x="630" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#17181c">Rejected</text>
  <line x1="360" y1="231" x2="360" y2="262" stroke="#555962" stroke-width="1.2"></line>
  <polygon points="355,262 360,270 365,262" fill="#555962"></polygon>
  <text x="368" y="250" font-size="12" fill="#555962">yes</text>

  <rect x="210.5" y="270.5" width="300" height="40" rx="9.5" fill="#cfd4fc" stroke="#3d50f5"></rect>
  <text x="360" y="295" text-anchor="middle" font-size="13" fill="#0f1c8a">Extract the device name from the CN (regex)</text>
  <line x1="360" y1="311" x2="360" y2="342" stroke="#555962" stroke-width="1.2"></line>
  <polygon points="355,342 360,350 365,342" fill="#555962"></polygon>

  <rect x="210.5" y="350.5" width="300" height="50" rx="9.5" fill="#edeef3" stroke="#555962"></rect>
  <text x="360" y="371" text-anchor="middle" font-size="13" fill="#17181c">Does a device with this name</text>
  <text x="360" y="389" text-anchor="middle" font-size="13" fill="#17181c">exist in the profile?</text>

  <polyline points="210,375 135,375 135,422" fill="none" stroke="#555962" stroke-width="1.2"></polyline>
  <polygon points="130,422 135,430 140,422" fill="#555962"></polygon>
  <text x="172" y="368" text-anchor="middle" font-size="12" fill="#555962">yes</text>
  <polyline points="511,375 585,375 585,422" fill="none" stroke="#555962" stroke-width="1.2"></polyline>
  <polygon points="580,422 585,430 590,422" fill="#555962"></polygon>
  <text x="548" y="368" text-anchor="middle" font-size="12" fill="#555962">no</text>

  <rect x="10.5" y="430.5" width="250" height="50" rx="9.5" fill="#edeef3" stroke="#555962"></rect>
  <text x="135" y="451" text-anchor="middle" font-size="13" fill="#17181c">Are the device's credentials</text>
  <text x="135" y="469" text-anchor="middle" font-size="13" fill="#17181c">of type X.509?</text>
  <rect x="460.5" y="430.5" width="250" height="50" rx="9.5" fill="#edeef3" stroke="#555962"></rect>
  <text x="585" y="451" text-anchor="middle" font-size="13" fill="#17181c">Is "Create new devices"</text>
  <text x="585" y="469" text-anchor="middle" font-size="13" fill="#17181c">enabled on the profile?</text>

  <line x1="70" y1="481" x2="70" y2="522" stroke="#555962" stroke-width="1.2"></line>
  <polygon points="65,522 70,530 75,522" fill="#555962"></polygon>
  <text x="78" y="508" font-size="12" fill="#555962">yes</text>
  <rect x="10.5" y="530.5" width="130" height="56" rx="9.5" fill="#defbd0" stroke="#4fdf0c"></rect>
  <text x="75" y="554" text-anchor="middle" font-size="13" fill="#17181c">Store certificate</text>
  <text x="75" y="574" text-anchor="middle" font-size="13" font-weight="600" fill="#17181c">Connected</text>

  <line x1="210" y1="481" x2="210" y2="522" stroke="#555962" stroke-width="1.2"></line>
  <polygon points="205,522 210,530 215,522" fill="#555962"></polygon>
  <text x="218" y="508" font-size="12" fill="#555962">no</text>
  <rect x="150.5" y="530.5" width="120" height="56" rx="9.5" fill="#f9c3d6" stroke="#f53d7d"></rect>
  <text x="210" y="554" text-anchor="middle" font-size="13" font-weight="600" fill="#17181c">Rejected</text>
  <text x="210" y="574" text-anchor="middle" font-size="12" fill="#17181c">e.g. access token</text>

  <line x1="525" y1="481" x2="525" y2="522" stroke="#555962" stroke-width="1.2"></line>
  <polygon points="520,522 525,530 530,522" fill="#555962"></polygon>
  <text x="533" y="508" font-size="12" fill="#555962">yes</text>
  <rect x="460.5" y="530.5" width="130" height="56" rx="9.5" fill="#defbd0" stroke="#4fdf0c"></rect>
  <text x="525" y="554" text-anchor="middle" font-size="13" fill="#17181c">Create device</text>
  <text x="525" y="574" text-anchor="middle" font-size="13" font-weight="600" fill="#17181c">Connected</text>

  <line x1="655" y1="481" x2="655" y2="522" stroke="#555962" stroke-width="1.2"></line>
  <polygon points="650,522 655,530 660,522" fill="#555962"></polygon>
  <text x="663" y="508" font-size="12" fill="#555962">no</text>
  <rect x="600.5" y="530.5" width="110" height="56" rx="9.5" fill="#f9c3d6" stroke="#f53d7d"></rect>
  <text x="655" y="563" text-anchor="middle" font-size="13" font-weight="600" fill="#17181c">Rejected</text>
</svg>
