<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" font-family="Roboto, Helvetica, Arial, sans-serif">
  <title>Device certificate lifecycle with X.509 certificate chain provisioning</title>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#353841" fill-opacity="0.5"></circle>
    </pattern>
  </defs>
  <rect width="720" height="260" fill="#17181c"></rect>
  <rect width="720" height="260" fill="url(#dots)"></rect>

  <text x="70" y="32" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.5" fill="#888c96">FACTORY</text>
  <text x="215" y="32" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.5" fill="#888c96">FIRST BOOT</text>
  <text x="360" y="32" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.5" fill="#888c96">OPERATION</text>
  <text x="505" y="32" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.5" fill="#888c96">RENEWAL</text>
  <text x="650" y="32" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.5" fill="#ee5389">COMPROMISE</text>

  <rect x="10.5" y="45.5" width="120" height="150" rx="9.5" fill="#23262f" stroke="#888c96"></rect>
  <text x="70" y="80" text-anchor="middle" font-size="13" fill="#ffffff">CA certificate</text>
  <text x="70" y="100" text-anchor="middle" font-size="13" fill="#ffffff">and bootstrap</text>
  <text x="70" y="120" text-anchor="middle" font-size="13" fill="#ffffff">credential</text>

  <rect x="155.5" y="45.5" width="120" height="150" rx="9.5" fill="#23262f" stroke="#888c96"></rect>
  <text x="215" y="80" text-anchor="middle" font-size="13" fill="#ffffff">Generate key</text>
  <text x="215" y="100" text-anchor="middle" font-size="13" fill="#ffffff">and CSR,</text>
  <text x="215" y="120" text-anchor="middle" font-size="13" fill="#ffffff">enroll with</text>
  <text x="215" y="140" text-anchor="middle" font-size="13" fill="#ffffff">your PKI</text>
  <text x="215" y="170" text-anchor="middle" font-size="12" fill="#888c96">unique certificate</text>

  <rect x="300.5" y="45.5" width="120" height="150" rx="9.5" fill="#17264f" stroke="#3369ff"></rect>
  <text x="360" y="80" text-anchor="middle" font-size="13" fill="#ffffff">Connect with</text>
  <text x="360" y="100" text-anchor="middle" font-size="13" fill="#ffffff">the chain;</text>
  <text x="360" y="120" text-anchor="middle" font-size="13" fill="#ffffff">ThingsBoard</text>
  <text x="360" y="140" text-anchor="middle" font-size="13" fill="#ffffff">binds the</text>
  <text x="360" y="160" text-anchor="middle" font-size="13" fill="#ffffff">certificate</text>

  <rect x="445.5" y="45.5" width="120" height="150" rx="9.5" fill="#17264f" stroke="#3369ff"></rect>
  <text x="505" y="80" text-anchor="middle" font-size="13" fill="#ffffff">Re-enroll</text>
  <text x="505" y="100" text-anchor="middle" font-size="13" fill="#ffffff">(same CN),</text>
  <text x="505" y="120" text-anchor="middle" font-size="13" fill="#ffffff">reconnect;</text>
  <text x="505" y="140" text-anchor="middle" font-size="13" fill="#ffffff">re-bound</text>
  <text x="505" y="160" text-anchor="middle" font-size="13" fill="#ffffff">automatically</text>

  <rect x="590.5" y="45.5" width="120" height="150" rx="9.5" fill="#4e2232" stroke="#ee5389" stroke-dasharray="5 4"></rect>
  <text x="650" y="80" text-anchor="middle" font-size="13" fill="#ffffff">New CN,</text>
  <text x="650" y="100" text-anchor="middle" font-size="13" fill="#ffffff">rename device,</text>
  <text x="650" y="120" text-anchor="middle" font-size="13" fill="#ffffff">reset</text>
  <text x="650" y="140" text-anchor="middle" font-size="13" fill="#ffffff">credentials,</text>
  <text x="650" y="160" text-anchor="middle" font-size="13" fill="#ffffff">revoke in PKI</text>

  <line x1="131" y1="120" x2="147" y2="120" stroke="#888c96" stroke-width="1.2"></line>
  <polygon points="147,115 155,120 147,125" fill="#888c96"></polygon>
  <line x1="276" y1="120" x2="292" y2="120" stroke="#888c96" stroke-width="1.2"></line>
  <polygon points="292,115 300,120 292,125" fill="#888c96"></polygon>
  <line x1="421" y1="120" x2="437" y2="120" stroke="#3369ff" stroke-width="1.2"></line>
  <polygon points="437,115 445,120 437,125" fill="#3369ff"></polygon>

  <text x="70" y="222" text-anchor="middle" font-size="12" fill="#888c96">Your PKI</text>
  <text x="215" y="222" text-anchor="middle" font-size="12" fill="#888c96">Device + PKI</text>
  <text x="360" y="222" text-anchor="middle" font-size="12" fill="#bdc3ff">ThingsBoard</text>
  <text x="505" y="222" text-anchor="middle" font-size="12" fill="#bdc3ff">Device + PKI + ThingsBoard</text>
  <text x="650" y="222" text-anchor="middle" font-size="12" fill="#ee5389">Manual procedure</text>
</svg>
