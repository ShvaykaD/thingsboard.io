<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" font-family="Roboto, Helvetica, Arial, sans-serif">
  <title>Device certificate lifecycle with X.509 certificate chain provisioning</title>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#c1c3c8" fill-opacity="0.5"></circle>
    </pattern>
  </defs>
  <rect width="720" height="260" fill="#ffffff"></rect>
  <rect width="720" height="260" fill="url(#dots)"></rect>

  <text x="70" y="32" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.5" fill="#555962">FACTORY</text>
  <text x="215" y="32" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.5" fill="#555962">FIRST BOOT</text>
  <text x="360" y="32" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.5" fill="#555962">OPERATION</text>
  <text x="505" y="32" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.5" fill="#555962">RENEWAL</text>
  <text x="650" y="32" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.5" fill="#f53d7d">COMPROMISE</text>

  <rect x="10.5" y="45.5" width="120" height="150" rx="9.5" fill="#edeef3" stroke="#555962"></rect>
  <text x="70" y="80" text-anchor="middle" font-size="13" fill="#17181c">CA certificate</text>
  <text x="70" y="100" text-anchor="middle" font-size="13" fill="#17181c">and bootstrap</text>
  <text x="70" y="120" text-anchor="middle" font-size="13" fill="#17181c">credential</text>

  <rect x="155.5" y="45.5" width="120" height="150" rx="9.5" fill="#edeef3" stroke="#555962"></rect>
  <text x="215" y="80" text-anchor="middle" font-size="13" fill="#17181c">Generate key</text>
  <text x="215" y="100" text-anchor="middle" font-size="13" fill="#17181c">and CSR,</text>
  <text x="215" y="120" text-anchor="middle" font-size="13" fill="#17181c">enroll with</text>
  <text x="215" y="140" text-anchor="middle" font-size="13" fill="#17181c">your PKI</text>
  <text x="215" y="170" text-anchor="middle" font-size="12" fill="#555962">unique certificate</text>

  <rect x="300.5" y="45.5" width="120" height="150" rx="9.5" fill="#cfd4fc" stroke="#3d50f5"></rect>
  <text x="360" y="80" text-anchor="middle" font-size="13" fill="#17181c">Connect with</text>
  <text x="360" y="100" text-anchor="middle" font-size="13" fill="#17181c">the chain;</text>
  <text x="360" y="120" text-anchor="middle" font-size="13" fill="#17181c">ThingsBoard</text>
  <text x="360" y="140" text-anchor="middle" font-size="13" fill="#17181c">binds the</text>
  <text x="360" y="160" text-anchor="middle" font-size="13" fill="#17181c">certificate</text>

  <rect x="445.5" y="45.5" width="120" height="150" rx="9.5" fill="#cfd4fc" stroke="#3d50f5"></rect>
  <text x="505" y="80" text-anchor="middle" font-size="13" fill="#17181c">Re-enroll</text>
  <text x="505" y="100" text-anchor="middle" font-size="13" fill="#17181c">(same CN),</text>
  <text x="505" y="120" text-anchor="middle" font-size="13" fill="#17181c">reconnect;</text>
  <text x="505" y="140" text-anchor="middle" font-size="13" fill="#17181c">re-bound</text>
  <text x="505" y="160" text-anchor="middle" font-size="13" fill="#17181c">automatically</text>

  <rect x="590.5" y="45.5" width="120" height="150" rx="9.5" fill="#f9c3d6" stroke="#f53d7d" stroke-dasharray="5 4"></rect>
  <text x="650" y="80" text-anchor="middle" font-size="13" fill="#17181c">New CN,</text>
  <text x="650" y="100" text-anchor="middle" font-size="13" fill="#17181c">rename device,</text>
  <text x="650" y="120" text-anchor="middle" font-size="13" fill="#17181c">reset</text>
  <text x="650" y="140" text-anchor="middle" font-size="13" fill="#17181c">credentials,</text>
  <text x="650" y="160" text-anchor="middle" font-size="13" fill="#17181c">revoke in PKI</text>

  <line x1="131" y1="120" x2="147" y2="120" stroke="#555962" stroke-width="1.2"></line>
  <polygon points="147,115 155,120 147,125" fill="#555962"></polygon>
  <line x1="276" y1="120" x2="292" y2="120" stroke="#555962" stroke-width="1.2"></line>
  <polygon points="292,115 300,120 292,125" fill="#555962"></polygon>
  <line x1="421" y1="120" x2="437" y2="120" stroke="#3d50f5" stroke-width="1.2"></line>
  <polygon points="437,115 445,120 437,125" fill="#3d50f5"></polygon>

  <text x="70" y="222" text-anchor="middle" font-size="12" fill="#555962">Your PKI</text>
  <text x="215" y="222" text-anchor="middle" font-size="12" fill="#555962">Device + PKI</text>
  <text x="360" y="222" text-anchor="middle" font-size="12" fill="#0f1c8a">ThingsBoard</text>
  <text x="505" y="222" text-anchor="middle" font-size="12" fill="#0f1c8a">Device + PKI + ThingsBoard</text>
  <text x="650" y="222" text-anchor="middle" font-size="12" fill="#f53d7d">Manual procedure</text>
</svg>
